services:
  favofeeder:
    build: .
    image: favofeeder:latest
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./config/targets.yaml:/app/config/targets.yaml:ro
      # Codex CLI (Plus plan) credentials; rw required as codex writes session files on each exec
      - ~/.codex:/root/.codex
    networks:
      - nekolog-network
    # favofeeder is a one-shot job; do not restart automatically.
    restart: "no"

networks:
  nekolog-network:
    external: true
    name: nekolog_nekolog-network
